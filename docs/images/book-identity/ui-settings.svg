<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="1060" viewBox="0 0 1000 1060" role="img">
  <title>界面线框：设置 · 图片模型</title>
  <desc>设置页“模型与用量”在“语音模型”下方新增“图片模型”：当前图片模型选择、模型配置入口、生成测试和最近用量；点击编辑或添加配置后，表单替换当前模型卡片，可从服务预设填入接口与模型，API Key 加密保存且不回显。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .sec { font-size: 15px; font-weight: 600; fill: #5F5E5A; }
      .nav-h { font-size: 12px; fill: #888780; font-weight: 600; }
      .nav { font-size: 13px; fill: #444441; }
      .nav-a { font-size: 13px; font-weight: 600; }
      .gt { font-size: 15px; font-weight: 600; }
      .it { font-size: 13.5px; font-weight: 600; }
      .is { font-size: 12px; fill: #5F5E5A; }
      .body { font-size: 13px; }
      .placeholder { font-size: 12.5px; fill: #888780; }
      .small { font-size: 12px; fill: #5F5E5A; }
      .tiny { font-size: 11.5px; fill: #5F5E5A; }
      .th { font-size: 12px; fill: #888780; }
      .td { font-size: 12.5px; }
      .ok { font-size: 12.5px; fill: #0F6E56; }
      .err { font-size: 12.5px; fill: #A32D2D; }
      .link { font-size: 12.5px; fill: #185FA5; }
      .btn { font-size: 13px; }
      .btn-p { font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .new { font-size: 10.5px; fill: #185FA5; font-weight: 600; }
    </style>
    <linearGradient id="test" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2340"/>
      <stop offset="1" stop-color="#C8643B"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1060" fill="#FFFFFF"/>

  <!-- A: settings view -->
  <text class="sec" x="40" y="34">A · 设置 → 模型与用量 → 图片模型</text>
  <rect x="20" y="46" width="960" height="600" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
  <path d="M20 58 Q20 46 32 46 H230 V646 H32 Q20 646 20 634 Z" fill="#F7F6F2"/>
  <line x1="230" y1="46" x2="230" y2="646" stroke="#E5E3DA"/>
  <rect x="36" y="62" width="178" height="28" rx="7" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="placeholder" x="48" y="81">搜索设置</text>
  <text class="nav-h" x="44" y="116">个人</text>
  <text class="nav" x="44" y="140">常规</text>
  <text class="nav" x="44" y="162">工作目录</text>
  <text class="nav" x="44" y="184">正文文本</text>
  <text class="nav" x="44" y="206">外观</text>
  <text class="nav" x="44" y="228">上下文</text>
  <text class="nav-h" x="44" y="260">模型与用量</text>
  <text class="nav" x="44" y="284">用量</text>
  <text class="nav" x="44" y="306">免费模型</text>
  <text class="nav" x="44" y="328">自定义模型</text>
  <text class="nav" x="44" y="372">新官方小站模型</text>
  <text class="nav" x="44" y="394">语音模型</text>
  <rect x="34" y="402" width="182" height="28" rx="7" fill="#EAE8E1"/>
  <text class="nav-a" x="44" y="421">图片模型</text>
  <rect x="160" y="408" width="40" height="16" rx="8" fill="#E6F1FB"/>
  <text class="new" x="180" y="420" text-anchor="middle">新增</text>
  <text class="nav-h" x="44" y="458">创作</text>
  <text class="nav" x="44" y="482">创作空间</text>
  <text class="nav" x="44" y="504">技能库</text>
  <text class="nav" x="44" y="526">素材库</text>
  <text class="nav-h" x="44" y="558">已归档</text>
  <text class="nav" x="44" y="582">已归档的聊天</text>

  <text class="gt" x="260" y="82">图片模型</text>
  <text class="tiny" x="956" y="82" text-anchor="end">生成封面时，封面提示词会发送给所选图片服务，作品正文不会直接发送</text>
  <rect x="260" y="94" width="696" height="118" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="it" x="280" y="122">当前图片模型</text>
  <text class="is" x="280" y="142">doubao-seedream-4-0-250828</text>
  <rect x="716" y="110" width="220" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="728" y="130">火山方舟 · 豆包 Seedream</text>
  <text class="body" x="924" y="130" text-anchor="end">▾</text>
  <line x1="280" y1="154" x2="936" y2="154" stroke="#EFEDE6"/>
  <text class="it" x="280" y="180">模型配置</text>
  <text class="is" x="280" y="200">管理服务密钥、接口地址与图片模型</text>
  <rect x="790" y="166" width="58" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="819" y="186" text-anchor="middle">编辑</text>
  <rect x="856" y="166" width="80" height="30" rx="8" fill="#2C2C2A"/>
  <text class="btn-p" x="896" y="186" text-anchor="middle">添加配置</text>

  <text class="gt" x="260" y="246">生成测试</text>
  <rect x="260" y="258" width="696" height="168" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="it" x="280" y="286">测试出图</text>
  <text class="is" x="280" y="306">用当前配置生成一张图，不保存到作品，计入用量</text>
  <rect x="280" y="318" width="430" height="64" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="body" x="292" y="340">雨夜古城的长街，一盏红灯笼在风里摇晃，</text>
  <text class="body" x="292" y="360">画面不含文字</text>
  <rect x="280" y="390" width="96" height="28" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="292" y="409">3:4</text>
  <text class="body" x="364" y="409" text-anchor="end">▾</text>
  <rect x="610" y="390" width="100" height="28" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="660" y="409" text-anchor="middle">生成测试图</text>
  <rect x="740" y="270" width="96" height="128" rx="6" fill="url(#test)"/>
  <circle cx="788" cy="330" r="9" fill="#E8503A"/>
  <text class="tiny" x="852" y="300">1728×2304</text>
  <text class="tiny" x="852" y="320">8.4 秒</text>
  <text class="tiny" x="852" y="340">不保存</text>

  <text class="gt" x="260" y="460">最近用量</text>
  <text class="link" x="956" y="460" text-anchor="end">刷新</text>
  <rect x="260" y="472" width="696" height="156" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="th" x="280" y="498">时间</text>
  <text class="th" x="380" y="498">配置</text>
  <text class="th" x="540" y="498">模型</text>
  <text class="th" x="720" y="498">张数</text>
  <text class="th" x="770" y="498">尺寸</text>
  <text class="th" x="850" y="498">耗时</text>
  <text class="th" x="900" y="498">状态</text>
  <line x1="280" y1="508" x2="936" y2="508" stroke="#EFEDE6"/>
  <text class="td" x="280" y="532">10-02 14:41</text>
  <text class="td" x="380" y="532">豆包 Seedream</text>
  <text class="td" x="540" y="532">doubao-seedream-4-0</text>
  <text class="td" x="720" y="532">1</text>
  <text class="td" x="770" y="532">3:4</text>
  <text class="td" x="850" y="532">38 s</text>
  <text class="ok" x="900" y="532">成功</text>
  <text class="td" x="280" y="560">10-02 14:41</text>
  <text class="td" x="380" y="560">豆包 Seedream</text>
  <text class="td" x="540" y="560">doubao-seedream-4-0</text>
  <text class="td" x="720" y="560">1</text>
  <text class="td" x="770" y="560">3:4</text>
  <text class="td" x="850" y="560">12 s</text>
  <text class="err" x="900" y="560">限流</text>
  <text class="td" x="280" y="588">10-02 11:05</text>
  <text class="td" x="380" y="588">通义千问图像</text>
  <text class="td" x="540" y="588">qwen-image-plus</text>
  <text class="td" x="720" y="588">1</text>
  <text class="td" x="770" y="588">3:4</text>
  <text class="td" x="850" y="588">21 s</text>
  <text class="ok" x="900" y="588">成功</text>
  <text class="tiny" x="280" y="614">只记录配置、模型、张数、尺寸与耗时，不记录作品名和提示词</text>

  <!-- B: edit form -->
  <text class="sec" x="40" y="690">B · 编辑或添加配置（表单替换“当前图片模型”卡片）</text>
  <rect x="20" y="702" width="960" height="340" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="gt" x="44" y="736">图片模型</text>
  <rect x="44" y="748" width="912" height="276" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>

  <text class="small" x="64" y="778">服务预设</text>
  <rect x="64" y="786" width="270" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="76" y="806">火山方舟 · 豆包 Seedream</text>
  <text class="body" x="322" y="806" text-anchor="end">▾</text>
  <text class="small" x="354" y="778">配置名称</text>
  <rect x="354" y="786" width="270" height="30" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="body" x="366" y="806">豆包 Seedream</text>
  <text class="tiny" x="644" y="806">预设：方舟 · 阿里云百炼 · 硅基流动 · 智谱 · OpenAI 兼容</text>

  <text class="small" x="64" y="842">接口地址</text>
  <rect x="64" y="850" width="560" height="30" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="body" x="76" y="870">https://ark.cn-beijing.volces.com/api/v3</text>
  <text class="small" x="644" y="842">模型</text>
  <rect x="644" y="850" width="292" height="30" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="body" x="656" y="870">doubao-seedream-4-0-250828</text>

  <text class="small" x="64" y="906">API Key</text>
  <rect x="64" y="914" width="476" height="30" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="placeholder" x="76" y="934">已保存，留空不修改</text>
  <text class="link" x="556" y="934">清除</text>
  <text class="small" x="644" y="906">默认比例</text>
  <rect x="644" y="914" width="96" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="656" y="934">3:4</text>
  <text class="body" x="728" y="934" text-anchor="end">▾</text>
  <text class="small" x="752" y="906">水印</text>
  <rect x="752" y="920" width="34" height="18" rx="9" fill="#D3D1C7"/>
  <circle cx="761" cy="929" r="7" fill="#FFFFFF"/>
  <text class="tiny" x="796" y="934">服务支持时显示</text>

  <line x1="64" y1="962" x2="936" y2="962" stroke="#EFEDE6"/>
  <text class="is" x="64" y="994">保存后作为当前图片模型使用；Key 用系统安全存储加密，只保存在本机</text>
  <rect x="770" y="976" width="64" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="802" y="996" text-anchor="middle">取消</text>
  <rect x="842" y="976" width="94" height="30" rx="8" fill="#2C2C2A"/>
  <text class="btn-p" x="889" y="996" text-anchor="middle">保存设置</text>
</svg>
