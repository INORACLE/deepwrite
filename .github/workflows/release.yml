name: Build and publish tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate tag and source version
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out released source
        id: source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release tag and both package versions
        run: node tools/release-version.mjs

  package:
    name: Package ${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win-x64
            os: windows-2025
            script: pack:test:win
            workers: 4
            heap: 6144
          - id: mac-arm64
            os: macos-15
            script: pack:test:mac:arm64
            workers: 3
            heap: 4096
          - id: mac-x64
            os: macos-15-intel
            script: pack:test:mac:x64
            workers: 4
            heap: 6144
          - id: linux-x64
            os: ubuntu-24.04
            script: pack:test:linux
            workers: 4
            heap: 6144
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DEEPWRITE_TEST_MAX_WORKERS: ${{ matrix.workers }}
      NODE_OPTIONS: --max-old-space-size=${{ matrix.heap }}
    steps:
      - name: Preserve LF source files on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out validated release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm and cache dependencies
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Linux desktop verification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb dbus-x11 libgtk-3-0t64 libnotify4 libnss3 libxss1 \
            libasound2t64 libsecret-1-0 libgbm1 libxtst6 libatspi2.0-0t64
          # Allow Electron's user-namespace sandbox on this disposable runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build and verify Linux installers
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm ${{ matrix.script }}

      - name: Build and verify native installers
        if: runner.os != 'Linux'
        run: pnpm ${{ matrix.script }}

      - name: Check macOS ZIP integrity
        if: runner.os == 'macOS'
        run: |
          for archive in apps/desktop/release/DeepWrite-*-mac-*-test.zip; do
            unzip -t "$archive"
          done

      - name: Keep verified platform installers
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.id }}
          path: |
            apps/desktop/release/DeepWrite-*
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  upload:
    name: Publish verified release installers
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Check out validated release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Install release tooling without native install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download platform artifacts into separate directories
        uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release-input
          merge-multiple: false

      - name: Verify checksums and merge macOS update manifests
        run: node tools/prepare-release-assets.mjs release-input release-upload

      - name: Upload to draft and publish verified installers
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { publishTagRelease } = await import(pathToFileURL(path.resolve('tools/publish-release-assets.mjs')).href);
            const url = await publishTagRelease({
              github, repo: context.repo, tag: process.env.RELEASE_TAG,
              commit: process.env.RELEASE_COMMIT,
              runId: context.runId,
              directory: path.resolve('release-upload')
            });
            await core.summary.addLink('Download release installers', url).write();
